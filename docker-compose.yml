version: '3'
name: test
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    build:
      context: .
      dockerfile: client/Dockerfile-client
    env_file:
      - .env
    volumes:
        - "./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template"
        - "$LOCAL_KEY_LOCATION:$NGINX_KEY_LOCATION"
        - "$LOCAL_CERT_LOCATION:$NGINX_CERT_LOCATION"
      
  db:
    container_name: test-mysql
    image: mysql:8.0.29
    volumes:
      - './database/mysql/data:/var/lib/mysql'
      - './database/mysql/securefile:/data/securefile'
    restart: 'unless-stopped'
    ports:
      - "3306:3306"
    env_file:
      - ./.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  
  server:
    container_name: test-server
    build:
        context: .
        dockerfile: ./server/Dockerfile
    ports:
        - '3000:3000'
    volumes:
      - "$LOCAL_KEY_LOCATION:$SERVER_KEY_LOCATION"
      - "$LOCAL_CERT_LOCATION:$SERVER_CERT_LOCATION"
    depends_on: # db server가 먼저 실행된 다음, 실행되어야 하는 컨테이너임.
        - db